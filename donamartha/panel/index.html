const TABLERO = { ENDPOINT: "https://script.google.com/macros/s/AKfycbzzHsVS9FGdRrVbpAGHfy2OKnNR57IHpB8z4qwf-KQJRJxOGhZiYdbqIhTQdN-3s7HZAQ/exec", NEGOCIO: "Doña Martha", SLUG: "donamartha" };

<style>
:root{
  --marca:#711A21;
  --sobre-marca:#FBF4EA;
  --tinta:#1F1F1F;
  --tinta-2:#5F6368;
  --tinta-3:#80868B;
  --linea:#E3E3E3;
  --superficie:#FFFFFF;
  --fondo-suave:#F6F7F8;
  --bien:#137333;
  --mal:#B3261E;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#F7F7F9;color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a{font:inherit}button{color:inherit;cursor:pointer}a{color:var(--marca)}
.barra{padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:var(--superficie)}
.cinta{max-width:1120px;margin:auto;display:flex;align-items:center;gap:16px}.barra img{height:44px;max-width:160px;object-fit:contain}.respaldo{display:none;font-weight:700}.cuando{margin-left:auto;font-size:13px;color:var(--tinta-2);text-align:right}
main{max-width:1120px;margin:auto;padding:24px 16px calc(env(safe-area-inset-bottom) + 40px)}
.historia{display:grid;gap:20px;align-items:start}.tarjeta{background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 24px #20202006;min-width:0}.ancha{grid-column:1/-1}
h2{font-size:23px;line-height:1.25;margin:0 0 22px;display:flex;align-items:center;gap:10px}h2 svg{width:24px;height:24px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
p{margin:10px 0}.base,.pie,.meta,.detalle{color:var(--tinta-2)}.heroe{display:flex;align-items:center;gap:20px}.numero{font-size:72px;line-height:1;letter-spacing:-3px}.estrellas{color:var(--marca);font-size:23px;letter-spacing:2px}.frase{font-weight:600;margin:8px 0 24px}.detalle{font-size:16px}
.desglose{list-style:none;padding:0;margin:0}.desglose li{margin-top:18px}.fila{display:flex;align-items:center;gap:12px}.etiqueta{flex:1;overflow-wrap:anywhere}.valor{white-space:nowrap;display:flex;gap:10px;font-variant-numeric:tabular-nums}.valor span:last-child{color:var(--tinta-2)}.pista{height:12px;background:#F0F0F3;border-radius:99px;overflow:hidden;margin-top:8px}.pista i{display:block;height:100%;background:var(--marca);border-radius:99px}
.accion{background:#FFF6E9}.accion h2{color:#784600}.accion a{display:inline-block;padding:12px 20px;background:var(--marca);color:var(--sobre-marca);border-radius:99px;text-decoration:none;font-weight:600;margin-top:8px}.orden{color:var(--bien);margin:0}.cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cifra{border-radius:24px;padding:22px;background:#fff;box-shadow:0 4px 24px #20202006}.rot,.val,.pie{display:block}.rot{font-weight:600}.val{font-size:38px;font-weight:650;margin:6px 0}.pie{font-size:16px}
.equipo{list-style:none;padding:0;margin:0;display:grid;gap:12px}.persona{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:#F8F8FA}.avatar{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--marca) 10%,white);color:var(--marca);font-weight:700}.persona .nombre{flex:1;min-width:0;overflow-wrap:anywhere}.persona small{display:block;font-size:16px;color:var(--tinta-2)}.persona.lider{background:color-mix(in srgb,var(--marca) 6%,white)}.sin-dato{color:var(--tinta-2)}.persona strong{white-space:nowrap}.medalla{color:var(--marca)}
.segmentos{display:flex;height:22px;overflow:hidden;border-radius:99px;margin:22px 0}.segmentos i{background:var(--marca)}.segmentos i:nth-child(2){background:#6A627D}.segmentos i:nth-child(3){background:#26736C}.leyenda{list-style:none;padding:0;margin:0;display:grid;gap:12px}.leyenda li{display:flex;align-items:center;gap:10px}.punto{width:12px;height:12px;border-radius:50%;flex-shrink:0}.leyenda strong{margin-left:auto;white-space:nowrap}.leyenda small{font-size:16px;color:var(--tinta-2)}
.tendencia{position:relative}.tendencia svg{display:block;width:100%;height:150px}.eje{display:flex;justify-content:space-between;color:var(--tinta-2);margin-top:12px}.globo{position:absolute;pointer-events:none;background:var(--tinta);color:white;padding:8px 12px;border-radius:12px;transform:translate(-50%,-100%);opacity:0;font-size:14px}.globo.visible{opacity:1}.tabla-oculta{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:16px}.item{display:grid;grid-template-columns:auto 1fr;gap:12px;background:#F5F5F8;border-radius:20px 20px 20px 6px;padding:20px;scroll-margin-top:20px}.nota{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#fff;font-weight:600;color:var(--marca)}.texto{overflow-wrap:anywhere}.meta{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:16px}.chip{border-radius:99px;padding:3px 10px;background:#fff}.hecho{color:var(--bien)}.atender{border:0;border-radius:99px;padding:12px 16px;min-height:44px;background:white;color:var(--marca);font-weight:600}.atender:disabled{opacity:.6}.item.malo{background:#FFF6E9}.item.destacado{outline:2px solid var(--marca)}.mas{display:block;margin:16px auto 0;border:0;background:transparent;padding:12px;color:var(--marca)}
.estado{text-align:center;padding:40px 24px;max-width:620px;margin:auto;background:#fff;border-radius:24px}.estado strong{display:block;font-size:24px;margin-bottom:12px}.cargando{display:grid;gap:20px}.esqueleto{height:180px;border-radius:24px;background:#ECECEF;animation:late 1.2s ease-in-out infinite}.pie-pagina{color:var(--tinta-2);font-size:16px;margin:24px 4px}button:focus-visible,a:focus-visible{outline:3px solid var(--marca);outline-offset:4px}
@keyframes late{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.esqueleto{animation:none}}@media(min-width:800px){.historia{grid-template-columns:repeat(2,minmax(0,1fr))}.cifras{grid-template-columns:repeat(4,minmax(0,1fr))}.tarjeta{padding:30px}.cargando{grid-template-columns:1fr 1fr}}
@font-face{font-family:"Fraunces";src:url("../encuesta/fraunces-variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Montserrat";src:url("../encuesta/montserrat-variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--superficie:#FBF4EA;--fondo:#F5E9D9;--tinta:#3B1A1C;--tinta-2:#6B4A45;--tinta-3:#6B4A45;--tinta-suave:#6B4A45;--linea:#E4D3BE;--fondo-suave:#FBF4EA;--titular:"Fraunces",Georgia,serif;color-scheme:light}
body{background:var(--fondo)}h1,h2,.heroe .numero{font-family:var(--titular);font-weight:600}
header,.barra{background:var(--fondo)}h1,h2,.lectura{color:var(--marca)}.opcion,input[type=text],input[type=tel],textarea,.prefijo .pais{background:var(--superficie)}.globo{color:var(--fondo)}
header img{max-height:84px;object-fit:contain}.barra img{height:58px;max-width:180px;object-fit:contain}
.item.malo .nota,.item.destacado{background:var(--superficie)}
:root{--sans:"Montserrat",system-ui,sans-serif}
</style>

<div class="barra">
  <div class="cinta">
    <img src="../encuesta/logo-claro.png" alt="Doña Martha" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="respaldo">Doña Martha</span>
    <span class="cuando" id="cuando"></span>
  </div>
</div>

<main id="lienzo">
  <div class="cargando" aria-label="Cargando">
    <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
  </div>
</main>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var lienzo = $("#lienzo");
var LLAVE = TABLERO.SLUG + "_tablero_clave";
var datos = null, mostrar = 6, destacado = null, reloj = null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pct(n, t){ return t ? Math.round(n / t * 100) : 0; }
function coma(n){ return String(n).replace(".", ","); }

/* La clave llega en #k=… la primera vez; después se recuerda en este celular
   y se borra de la barra de direcciones para que no quede a la vista. */
function leerHash(){
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get("k")) { try { localStorage.setItem(LLAVE, h.get("k")); } catch(_){} }
  destacado = h.get("atender");
  if (h.get("k") || h.get("atender")) history.replaceState(null, "", location.pathname + location.search);
}
function clave(){ try { return localStorage.getItem(LLAVE) || ""; } catch(_){ return ""; } }

function estado(titulo, texto){
  lienzo.innerHTML = '<div class="estado"><strong>' + esc(titulo) + '</strong>' + esc(texto) + '</div>';
}

/* "hace 2 h", "ayer 20:15", "12 oct" — como lo diría una persona. */
var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function cuando(fecha, hora){
  if (!fecha) return "";
  var p = fecha.split("-").map(Number), h = (hora || "00:00").split(":").map(Number);
  var f = new Date(p[0], p[1] - 1, p[2], h[0], h[1]), ahora = new Date();
  var min = Math.round((ahora - f) / 60000);
  var hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  var dias = Math.round((hoy - new Date(p[0], p[1] - 1, p[2])) / 86400000);
  if (min >= 0 && min < 60) return min <= 1 ? "recién" : "hace " + min + " min";
  if (dias === 0) return "hoy " + hora;
  if (dias === 1) return "ayer " + hora;
  if (dias < 7) return "hace " + dias + " días";
  return p[2] + " " + MESES[p[1] - 1];
}
function semanaTexto(desde){
  var p = desde.split("-").map(Number);
  return p[2] + " " + MESES[p[1] - 1];
}

/* Promedio de las últimas 4 semanas frente a las 4 anteriores. */
function delta(semanas){
  function prom(lista){
    var s = 0, n = 0;
    lista.forEach(function(x){ if (x.promedio !== null){ s += x.promedio * x.n; n += x.n; } });
    return n ? s / n : null;
  }
  var a = prom(semanas.slice(-4)), b = prom(semanas.slice(-8, -4));
  if (a === null || b === null) return null;
  return Math.round((a - b) * 10) / 10;
}

function titulo(texto, icono){
  var trazos={nota:'M12 3l3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z',hoy:'M9 12l2 2 4-4 M5 4h14v17H5z',equipo:'M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3a6 6 0 0 1 12 0v3 M17 5a3 3 0 0 1 0 6 M18 15a4 4 0 0 1 4 4v2',visitas:'M3 11l9-8 9 8 M5 10v11h14V10 M10 21v-7h4v7',barras:'M4 20V10 M12 20V4 M20 20v-7',comentarios:'M4 4h16v13H9l-5 4z'};
  return '<h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(trazos[icono]||trazos.barras)+'"/></svg>'+esc(texto)+'</h2>';
}
function tarjeta(id, texto, contenido, icono, clases){return '<section id="'+id+'" class="tarjeta '+(clases||'')+'">'+titulo(texto,icono)+contenido+'</section>';}
function fraseNota(n){return n>=4.5?'¡Excelente! Tus clientes están felices':n>=4?'Muy bien':n>=3?'Hay cosas por mejorar':'Atención: hay clientes molestos';}
function pintar(){
  var d=datos;
  $("#cuando").innerHTML=esc('Actualizado '+ultimaActualizacion);
  if (!d.total){estado('Todavía no hay respuestas.','Aparecen aquí apenas el primer cliente escanee el QR.');return;}
  var llenas=Math.round(d.promedio), distribucion='';
  for(var n=5;n>=1;n--){var cantidad=(d.estrellas||[])[n-1]||0;distribucion+=filaOpcion(n+' ★',cantidad,pct(cantidad,d.total)+'%',pct(cantidad,d.total));}
  var html='<div class="historia">'+tarjeta('calificacion','¿Cómo te califican?',
    '<div class="heroe"><span class="numero">'+coma(d.promedio.toFixed(1))+'</span><div><div class="estrellas" aria-label="'+coma(d.promedio)+' de 5 estrellas">'+'★'.repeat(llenas)+'☆'.repeat(5-llenas)+'</div><span class="detalle">'+d.total+' respuestas</span></div></div><p class="frase">'+fraseNota(d.promedio)+'</p><ul class="desglose">'+distribucion+'</ul>','nota');
  var pendientes=Math.max(0,(d.insatisfechos||0)-(d.atendidos||0));
  html+=tarjeta('hoy','¿Qué tienes que hacer hoy?',pendientes?'<p><strong>'+pendientes+(pendientes===1?' cliente necesita':' clientes necesitan')+' tu atención</strong></p><p>Escucharlos puede hacer la diferencia.</p><a href="#comentarios">Ver '+(pendientes===1?'comentario pendiente':'comentarios pendientes')+'</a>':'<p class="orden">Todo en orden ✓</p>','hoy',pendientes?'accion':'');
  html+='<div class="cifras ancha" aria-label="Números clave">'+cifra('Felices',d.felices||0,'Con 4 o 5 estrellas')+cifra('Fueron a Google',d.aGoogle||0,'Abrieron el enlace de reseña')+cifra('Clientes nuevos',d.nuevos||0,'Vinieron por primera vez')+cifra('Dejaron su WhatsApp',d.conContacto||0,'Para seguir en contacto')+'</div>';
  if(d.personal) html+=equipo(d.personal);
  if(d.visitas) html+=visitas(d.visitas);
  html+=opciones('canales','¿Cómo te encontraron?',d.canales,'trae al');
  html+=opciones('destacan','¿Qué es lo que más les gusta?',d.destacan,'destaca para el');
  if((d.semanas||[]).length) html+=tarjeta('semanas','Respuestas por semana',grafico(d.semanas),'barras');
  var lista=(d.comentarios||[]).slice().sort(function(a,b){return Number(!!b.insatisfecho&&!b.atendida)-Number(!!a.insatisfecho&&!a.atendida);});
  if(lista.length) html+=tarjeta('comentarios','Lo que te dijeron','<ul class="lista">'+lista.slice(0,mostrar).map(item).join('')+'</ul>'+(lista.length>mostrar?'<button class="mas" id="mas">Ver más</button>':''),'comentarios','ancha');
  html+='</div><p class="pie-pagina">Los nombres y teléfonos de tus clientes están solo en tu hoja de respuestas.</p>';
  lienzo.innerHTML=html;conectarGrafico();
  var m=$('#mas');if(m)m.onclick=function(){mostrar+=10;pintar();};
  if(destacado){var e=document.getElementById('c-'+destacado);if(e)e.scrollIntoView({block:'center'});}
}
function filaOpcion(nombre,n,valor,ancho){
  return '<li><div class="fila"><span class="etiqueta">'+esc(nombre)+'</span><span class="valor"><span>'+n+'</span><span>'+esc(valor)+'</span></span></div><div class="pista" aria-hidden="true"><i style="width:'+ancho+'%"></i></div></li>';
}
function opciones(id,tituloTexto,valores,verbo){
  var lista=Object.keys(valores||{}).map(function(k){return {nombre:k,n:valores[k]};}).filter(function(x){return x.n>0;}).sort(function(a,b){return b.n-a.n||a.nombre.localeCompare(b.nombre,'es');});
  var total=lista.reduce(function(n,x){return n+x.n;},0);if(!total)return '';
  var ganador=lista[0];
  return tarjeta(id,tituloTexto,'<p class="frase">'+esc(ganador.nombre)+' '+verbo+' '+pct(ganador.n,total)+' %</p><ul class="desglose">'+lista.map(function(x){return filaOpcion(x.nombre,x.n,pct(x.n,total)+'%',pct(x.n,total));}).join('')+'</ul>','barras');
}
function equipo(personal){
  var lista=Object.keys(personal).map(function(k){return {nombre:k,n:personal[k].n,promedio:personal[k].promedio};}).filter(function(x){return x.n>0;}).sort(function(a,b){return (a.nombre==='Sin dato')-(b.nombre==='Sin dato')||b.promedio-a.promedio||b.n-a.n||a.nombre.localeCompare(b.nombre,'es');});
  if(!lista.length)return '';
  return tarjeta('equipo','Tu equipo','<ol class="equipo">'+lista.map(function(x,i){var sin=x.nombre==='Sin dato';return '<li class="persona '+(sin?'sin-dato':i===0?'lider':'')+'">'+(sin?'':'<span class="avatar" aria-hidden="true">'+esc(x.nombre.charAt(0))+'</span>')+'<span class="nombre">'+esc(x.nombre)+(i===0&&!sin?' <span class="medalla" aria-label="Mejor promedio">♛</span>':'')+'<small>'+x.n+(x.n===1?' calificación':' calificaciones')+'</small></span><strong>'+coma(x.promedio.toFixed(1))+' ★</strong></li>';}).join('')+'</ol>','equipo');
}
function visitas(valores){
  var etiquetas=['Sí, es mi primera vez','Ya había venido antes','Vengo seguido'];
  var nombres=['Primera vez','Ya habían venido','Vienen seguido'],colores=['var(--marca)','#6A627D','#26736C'];
  var total=etiquetas.reduce(function(n,k){return n+(valores[k]||0);},0);if(!total)return '';
  var nuevos=pct(valores[etiquetas[0]]||0,total),frase=nuevos===50?'La mitad viene por primera vez':nuevos>50?'La mayoría viene por primera vez':'La mayoría ya te conoce';
  return tarjeta('visitas','¿Quiénes te visitan?','<p class="frase">'+frase+'</p><div class="segmentos" aria-hidden="true">'+etiquetas.map(function(k){return '<i style="flex:'+(valores[k]||0)+'"></i>';}).join('')+'</div><ul class="leyenda">'+etiquetas.map(function(k,i){var n=valores[k]||0;return n?'<li><i class="punto" aria-hidden="true" style="background:'+colores[i]+'"></i>'+nombres[i]+'<strong>'+n+' <small>· '+pct(n,total)+'%</small></strong></li>':'';}).join('')+'</ul>','visitas');
}

function cifra(rot, val, pie){
  return '<div class="cifra"><span class="rot">' + esc(rot) + '</span><span class="val">' + esc(val) + '</span><span class="pie">' + pie + '</span></div>';
}

function item(c){
  var malo = c.insatisfecho;
  var meta = '<span>' + esc(cuando(c.fecha, c.hora)) + '</span>'
    + (c.primera ? '<span class="chip">Primera vez</span>' : '')
    + (c.contacto ? '<span class="chip">Dejó WhatsApp</span>' : '');
  if (malo) meta += c.atendida
    ? '<span class="hecho">✓ Atendido</span><button class="atender" data-id="' + esc(c.id) + '" data-deshacer="1">Deshacer</button>'
    : '<button class="atender" data-id="' + esc(c.id) + '">Ya lo atendí</button>';
  return '<li class="item' + (malo ? ' malo' : '') + (c.id === destacado ? ' destacado' : '') + '" id="c-' + esc(c.id) + '">'
    + '<span class="nota" aria-label="' + c.nota + ' de 5 estrellas">' + (c.nota || "–") + '★</span>'
    + (c.texto ? '<span class="texto">' + esc(c.texto) + '</span>' : '<span class="texto vacio">Sin comentario escrito</span>')
    + '<span class="meta">' + meta + '</span></li>';
}

/* Columnas de una sola serie: sin leyenda, el título dice qué es. Etiqueta
   solo en la semana actual; el resto va en el globo y en la tabla oculta. */
function grafico(semanas){
  var W = 600, H = 150, base = H - 4, alto = H - 26;
  var max = Math.max(1, Math.max.apply(null, semanas.map(function(s){ return s.n; })));
  var paso = W / semanas.length, ancho = Math.min(24, paso * 0.56);
  var barras = semanas.map(function(s, i){
    var h = s.n ? Math.max(4, s.n / max * alto) : 0;
    var x = i * paso + (paso - ancho) / 2, y = base - h, r = Math.min(4, h);
    var forma = h ? '<path d="M' + x + ' ' + base + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y
      + 'H' + (x + ancho - r) + 'Q' + (x + ancho) + ' ' + y + ' ' + (x + ancho) + ' ' + (y + r) + 'V' + base + 'Z" fill="var(--marca)"'
      + (i === semanas.length - 1 ? '' : ' fill-opacity=".55"') + '/>' : '';
    var etiqueta = i === semanas.length - 1 && s.n
      ? '<text x="' + (x + ancho / 2) + '" y="' + (y - 6) + '" text-anchor="middle" font-size="13" font-weight="600" fill="var(--tinta)">' + s.n + '</text>' : '';
    return forma + etiqueta + '<rect class="blanco" data-i="' + i + '" x="' + (i * paso) + '" y="0" width="' + paso + '" height="' + H + '" fill="transparent"/>';
  }).join("");
  var tabla = '<table class="tabla-oculta"><caption>Respuestas por semana</caption><tr><th>Semana del</th><th>Respuestas</th><th>Promedio</th><th>Insatisfechos</th></tr>'
    + semanas.map(function(s){ return '<tr><td>' + semanaTexto(s.desde) + '</td><td>' + s.n + '</td><td>' + (s.promedio === null ? "–" : coma(s.promedio)) + '</td><td>' + s.malas + '</td></tr>'; }).join("") + '</table>';
  return '<div class="tendencia"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Respuestas por semana, últimas 12 semanas">'
    + barras + '</svg><div class="globo" id="globo"></div>'
    + '<div class="eje"><span>' + semanaTexto(semanas[0].desde) + '</span><span>Esta semana</span></div>' + tabla + '</div>';
}

function conectarGrafico(){
  var svg = document.querySelector(".tendencia svg"), globo = $("#globo");
  if (!svg) return;
  function mostrarGlobo(e){
    var t = e.target.closest ? e.target.closest(".blanco") : null;
    if (!t){ globo.classList.remove("visible"); return; }
    var s = datos.semanas[Number(t.getAttribute("data-i"))];
    var caja = svg.getBoundingClientRect(), x = (Number(t.getAttribute("x")) + Number(t.getAttribute("width")) / 2) / 600 * caja.width;
    globo.innerHTML = '<b>Semana del ' + semanaTexto(s.desde) + '</b><br>' + s.n + (s.n === 1 ? ' respuesta' : ' respuestas')
      + (s.promedio !== null ? ' · ' + coma(s.promedio) + '★' : '') + (s.malas ? '<br>' + s.malas + ' insatisfecho' + (s.malas > 1 ? 's' : '') : '');
    globo.style.left = Math.max(70, Math.min(caja.width - 70, x)) + "px";
    globo.style.top = "8px";
    globo.classList.add("visible");
  }
  svg.addEventListener("pointermove", mostrarGlobo);
  svg.addEventListener("pointerdown", mostrarGlobo);
  svg.addEventListener("pointerleave", function(){ globo.classList.remove("visible"); });
}

/* Marcar atendido: el botón se apaga hasta que la hoja confirma. */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".atender") : null;
  if (!b) return;
  b.disabled = true; b.textContent = "Guardando…";
  fetch(TABLERO.ENDPOINT, {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ accion:"atender", clave:clave(), id:b.getAttribute("data-id"), deshacer: !!b.getAttribute("data-deshacer") })
  }).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || "no se guardó");
    return cargar();
  }).catch(function(){ b.disabled = false; b.textContent = "No se guardó, reintentar"; });
});

var cargando = false, ultimaActualizacion = "";
function cargar(){
  if (cargando) return Promise.resolve();
  cargando = true;
  return fetch(TABLERO.ENDPOINT + "?datos=" + encodeURIComponent(clave()))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.error === "clave"){
        try { localStorage.removeItem(LLAVE); } catch(_){}
        estado("Este enlace ya no sirve", "Pídele a CREAM el enlace nuevo de tu panel.");
        return;
      }
      if (!d || !d.ok) throw new Error("respuesta inesperada");
      datos = d;
      ultimaActualizacion = new Date().toLocaleTimeString("es-PE", {timeZone:"America/Lima",hour:"2-digit",minute:"2-digit",hour12:false});
      pintar();
    })
    .catch(function(err){
      if (!datos) estado("No pudimos cargar tus datos", "Revisa tu conexión y vuelve a abrir esta página en un minuto.");
      // Conserva los datos pintados si falla un refresco.
    }).finally(function(){ cargando = false; });
}

function arrancar(){
  leerHash();
  if (!TABLERO.ENDPOINT){ estado("Tu panel está casi listo", "Se activa cuando la encuesta de la mesa empiece a guardar respuestas."); return; }
  if (!clave()){ estado("Abre el enlace que te enviamos", "Tu panel es privado: entra con el enlace completo que te pasó CREAM."); return; }
  cargar();
  // Se refresca solo cada minuto mientras está a la vista.
  reloj = setInterval(function(){ if (document.visibilityState === "visible") cargar(); }, 60000);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") cargar(); });
  window.addEventListener("hashchange", function(){ leerHash(); cargar(); });
}
arrancar();
})();
</script>
