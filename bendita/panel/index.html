<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var lienzo = $("#lienzo");
var LLAVE = TABLERO.SLUG + "_tablero_clave";

var datos = null, destacado = null, reloj = null;
var lecturasPendientes = new Set(), avisoLectura = "", revisionLecturas = 0;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pct(n, t){ return t ? Math.round(n / t * 100) : 0; }
function coma(n){ return String(n).replace(".", ","); }

/* La clave llega en #k=… o se escribe y valida; después se recuerda en este celular
   y se borra de la barra de direcciones para que no quede a la vista. */
function leerHash(){
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get("k")) { try { localStorage.setItem(LLAVE, h.get("k")); } catch(_){} }
  destacado = h.get("atender");
  if (h.get("k") || h.get("atender")) history.replaceState(null, "", location.pathname + location.search);
}
function clave(){ try { return claveSesion || localStorage.getItem(LLAVE) || ""; } catch(_){ return claveSesion; } }

function estado(titulo, texto){
  lienzo.innerHTML = '<div class="estado"><strong>' + esc(titulo) + '</strong>' + esc(texto) + '</div>';
}

/* "hace 2 h", "ayer 20:15", "12 oct" — como lo diría una persona. */
var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function cuando(fecha, hora){
  if (!fecha) return "";
  var p = fecha.split("-").map(Number), h = (hora || "00:00").split(":").map(Number);
  var f = new Date(p[0], p[1] - 1, p[2], h[0], h[1]), ahora = new Date();
  var min = Math.round((ahora - f) / 60000);
  var hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  var dias = Math.round((hoy - new Date(p[0], p[1] - 1, p[2])) / 86400000);
  if (min >= 0 && min < 60) return min <= 1 ? "recién" : "hace " + min + " min";
  if (dias === 0) return "hoy " + hora;
  if (dias === 1) return "ayer " + hora;
  if (dias < 7) return "hace " + dias + " días";
  return p[2] + " " + MESES[p[1] - 1];
}
function semanaTexto(desde){
  var p = desde.split("-").map(Number);
  return p[2] + " " + MESES[p[1] - 1];
}

/* Promedio de las últimas 4 semanas frente a las 4 anteriores. */
function delta(semanas){
  function prom(lista){
    var s = 0, n = 0;
    lista.forEach(function(x){ if (x.promedio !== null){ s += x.promedio * x.n; n += x.n; } });
    return n ? s / n : null;
  }
  var a = prom(semanas.slice(-4)), b = prom(semanas.slice(-8, -4));
  if (a === null || b === null) return null;
  return Math.round((a - b) * 10) / 10;
}

function titulo(texto, icono){
  var trazos={nota:'M12 3l3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z',hoy:'M9 12l2 2 4-4 M5 4h14v17H5z',equipo:'M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3a6 6 0 0 1 12 0v3 M17 5a3 3 0 0 1 0 6 M18 15a4 4 0 0 1 4 4v2',visitas:'M3 11l9-8 9 8 M5 10v11h14V10 M10 21v-7h4v7',barras:'M4 20V10 M12 20V4 M20 20v-7',comentarios:'M4 4h16v13H9l-5 4z'};
  return '<h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(trazos[icono]||trazos.barras)+'"/></svg>'+esc(texto)+'</h2>';
}
function tarjeta(id, texto, contenido, icono, clases){return '<section id="'+id+'" class="tarjeta '+(clases||'')+'">'+titulo(texto,icono)+contenido+'</section>';}
function fraseNota(n){return n>=4.5?'¡Excelente! Tus clientes están felices':n>=4?'Muy bien':n>=3?'Hay cosas por mejorar':'Atención: hay clientes molestos';}
/* Reglas canónicas: CONCLUSIONES-CREAM.md. No lee DOM, reloj ni datos personales. */
function conclusiones(d){
  if (d.total === 0) return ['Cuando lleguen las primeras respuestas, aquí verás lo más importante de tu negocio.'];
  var candidatas=[], orden=0;
  function agregar(cumple, tema, prioridad, texto){if(cumple)candidatas.push({tema:tema,prioridad:prioridad,orden:orden,texto:texto});orden++;}
  function decimal(n){return Number(n).toFixed(1).replace('.',',');}
  function porcentaje(n,t){return Math.round(n/t*100)+' %';}
  function opcionesPositivas(obj){return Object.keys(obj||{}).map(function(k,i){return {nombre:k,n:obj[k],orden:i};}).filter(function(x){return x.n>0;}).sort(function(a,b){return b.n-a.n||a.orden-b.orden;});}
  function suma(lista){return lista.reduce(function(n,x){return n+x.n;},0);}
  var x=(d.insatisfechos||0)-(d.atendidos||0), premios=(d.cuponesPendientes||[]).length;
  agregar(x>0,'urgente',100,'Tienes '+x+(x===1?' cliente que se fue molesto y aún no lo atiendes.':' clientes que se fueron molestos y aún no los atiendes.')+(x===1?' Escríbele':' Escríbeles')+' hoy: uno bien atendido después de una mala experiencia suele volver.');
  agregar(premios>0,'urgente',95,premios+(premios===1?' premio espera':' premios esperan')+' su WhatsApp. '+(premios===1?'Envíalo':'Envíalos')+' desde “Cupones por enviar” para cumplir lo prometido.');
  var semanas=d.semanas||[], indice=-1;
  semanas.forEach(function(s,i){if(s.n>=5&&s.promedio!=null)indice=i;});
  var anteriores=semanas.slice(0,Math.max(0,indice)).filter(function(s){return s.n>0&&s.promedio!=null;}).slice(-4);
  var n=suma(anteriores), antes=n?anteriores.reduce(function(t,s){return t+s.n*s.promedio;},0)/n:null;
  var ahora=indice>=0?semanas[indice].promedio:null;
  agregar(antes!==null&&ahora!==null&&antes-ahora>=0.5-1e-9,'tendencia',85,'Tu calificación bajó esta semana: de '+decimal(antes)+'★ a '+decimal(ahora)+'★. Lee “Lo que te dijeron” y corrige lo que más se repita.');
  agregar(antes!==null&&ahora!==null&&ahora-antes>=0.3-1e-9,'tendencia',55,'Vas mejorando: esta semana te calificaron con '+decimal(ahora)+'★, frente a '+decimal(antes)+'★ de antes. Lo que cambiaste está funcionando.');
  agregar(d.total<10,'muestra',80,'Llevas '+d.total+(d.total===1?' respuesta.':' respuestas.')+' Desde las 10, estas conclusiones se vuelven firmes: que la tarjeta con QR vaya en cada cuenta.');
  var equipo=Object.keys(d.personal||{}).filter(function(k){return k.trim().toLowerCase()!=='sin dato'&&d.personal[k].n>=5;}).map(function(k,i){return {nombre:k,n:d.personal[k].n,promedio:d.personal[k].promedio,orden:i};});
  var bajos=equipo.filter(function(p){return p.promedio<=3.5;}).sort(function(a,b){return a.promedio-b.promedio||a.orden-b.orden;}), bajo=bajos[0]||{};
  agregar(!!bajos.length,'equipo',75,bajo.nombre+' tiene '+decimal(bajo.promedio)+'★ en '+bajo.n+' atenciones. Conviene acompañarlo y ver qué está pasando en sus mesas.');
  agregar(d.total>=10&&d.promedio<4,'calidad',70,'Tu promedio es '+decimal(d.promedio)+'★, todavía bajo para Google. Lo que más se repite en las quejas te dice por dónde empezar.');
  agregar(d.total>=10&&d.promedio>=4.5,'calidad',50,'Te califican con '+decimal(d.promedio)+'★: estás en lo que la gente busca en Google. Mantén la encuesta en cada mesa para seguir sumando reseñas.');
  agregar(d.aGoogle>=1,'google',45,d.aGoogle+(d.aGoogle===1?' cliente feliz fue':' clientes felices fueron')+' a dejarte su reseña de 5★ en Google. Cada una te ayuda a aparecer primero.');
  var canales=opcionesPositivas(d.canales), canal=canales[0]||{}, nc=suma(canales);
  agregar(nc>=5&&canal.n/nc>=0.4,'canales',48,canal.nombre+' es por donde más te encuentran ('+porcentaje(canal.n,nc)+'). Ahí conviene poner más contenido y publicidad.');
  var visitas=opcionesPositivas(d.visitas), nv=suma(visitas), primera=visitas.filter(function(v){return /primera/i.test(v.nombre);}).reduce(function(n,v){return n+v.n;},0);
  agregar(nv>=5&&primera/nv>=0.6,'clientes',46,porcentaje(primera,nv)+' venía por primera vez: tu publicidad está trayendo gente nueva. Ahora el reto es que vuelvan, y el premio ayuda.');
  agregar(nv>=5&&primera/nv<=0.3,'clientes',46,'La mayoría ya te conocía ('+porcentaje(nv-primera,nv)+' repite). Tienes clientes fieles; conviene invertir en atraer gente nueva.');
  var productos=opcionesPositivas(d.destacan), producto=productos[0]||{}, np=suma(productos);
  agregar(np>=5&&producto.n/np>=0.3,'producto',44,'Lo que más te elogian es '+producto.nombre+' ('+porcentaje(producto.n,np)+'). Úsalo como mensaje principal en tus publicaciones.');
  var altos=equipo.filter(function(p){return p.promedio>=4.7;}).sort(function(a,b){return b.promedio-a.promedio||b.n-a.n||a.orden-b.orden;}), alto=altos[0]||{};

/* Mismo molde que imagen-cumple.py: 78 px hacia abajo hasta caber en 960 px, corte más parejo, desde y=135. */
function imagenCumple(nombre){
  var cfg=TABLERO.CUMPLE, fuente=new FontFace('MarcaCumple','url('+cfg.fuente+')');
  var base=new Image();
  var carga=new Promise(function(ok,mal){base.onload=ok;base.onerror=mal;base.src=cfg.base;});
  return Promise.all([fuente.load().then(function(f){document.fonts.add(f);}),carga]).then(function(){
    var lienzo=document.createElement('canvas');lienzo.width=1080;lienzo.height=1350;
    var c=lienzo.getContext('2d');c.drawImage(base,0,0,1080,1350);
    var titulo=tituloCumple(nombre),palabras=titulo.split(' '),eleccion=null,tam=78;
    for(;tam>=28&&!eleccion;tam--){
      c.font=tam+'px MarcaCumple';
      var opciones=[[titulo]];for(var i=1;i<palabras.length;i++)opciones.push([palabras.slice(0,i).join(' '),palabras.slice(i).join(' ')]);
      opciones=opciones.filter(function(ls){return Math.max.apply(null,ls.map(function(l){return c.measureText(l).width;}))<=960;});
      if(opciones.length)eleccion=opciones.sort(function(a,b){
        var da=Math.max.apply(null,a.map(function(l){return c.measureText(l).width;}))-Math.min.apply(null,a.map(function(l){return c.measureText(l).width;}));
        var db=Math.max.apply(null,b.map(function(l){return c.measureText(l).width;}))-Math.min.apply(null,b.map(function(l){return c.measureText(l).width;}));
        return da-db;})[0];
    }
    tam++;c.font=tam+'px MarcaCumple';c.fillStyle=cfg.color;c.textAlign='center';c.textBaseline='top';
    var y=135;(eleccion||[titulo]).forEach(function(l){c.fillText(l,540,y);y+=tam+26;});
    return new Promise(function(ok){lienzo.toBlob(function(b){ok(b);},'image/png');});
  });
}

/* Columnas de una sola serie: sin leyenda, el título dice qué es. Etiqueta
   solo en la semana actual; el resto va en el globo y en la tabla oculta. */
function grafico(semanas){
  var W = 600, H = 150, base = H - 4, alto = H - 26;
  var max = Math.max(1, Math.max.apply(null, semanas.map(function(s){ return s.n; })));
  var paso = W / semanas.length, ancho = Math.min(24, paso * 0.56);
  var barras = semanas.map(function(s, i){
    var h = s.n ? Math.max(4, s.n / max * alto) : 0;
    var x = i * paso + (paso - ancho) / 2, y = base - h, r = Math.min(4, h);
    var forma = h ? '<path d="M' + x + ' ' + base + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y
      + 'H' + (x + ancho - r) + 'Q' + (x + ancho) + ' ' + y + ' ' + (x + ancho) + ' ' + (y + r) + 'V' + base + 'Z" fill="var(--marca)"'
      + (i === semanas.length - 1 ? '' : ' fill-opacity=".55"') + '/>' : '';
    var etiqueta = i === semanas.length - 1 && s.n
      ? '<text x="' + (x + ancho / 2) + '" y="' + (y - 6) + '" text-anchor="middle" font-size="13" font-weight="600" fill="var(--tinta)">' + s.n + '</text>' : '';
    return forma + etiqueta + '<rect class="blanco" data-i="' + i + '" x="' + (i * paso) + '" y="0" width="' + paso + '" height="' + H + '" fill="transparent"/>';
  }).join("");
  var tabla = '<table class="tabla-oculta"><caption>Respuestas por semana</caption><tr><th>Semana del</th><th>Respuestas</th><th>Promedio</th><th>Insatisfechos</th></tr>'
    + semanas.map(function(s){ return '<tr><td>' + semanaTexto(s.desde) + '</td><td>' + s.n + '</td><td>' + (s.promedio === null ? "–" : coma(s.promedio)) + '</td><td>' + s.malas + '</td></tr>'; }).join("") + '</table>';
  return '<div class="tendencia"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Respuestas por semana, últimas 12 semanas">'
    + barras + '</svg><div class="globo" id="globo"></div>'
    + '<div class="eje"><span>' + semanaTexto(semanas[0].desde) + '</span><span>Esta semana</span></div>' + tabla + '</div>';
}

function conectarGrafico(){
  var svg = document.querySelector(".tendencia svg"), globo = $("#globo");
  if (!svg) return;
  function mostrarGlobo(e){
    var t = e.target.closest ? e.target.closest(".blanco") : null;
    if (!t){ globo.classList.remove("visible"); return; }
    var s = datos.semanas[Number(t.getAttribute("data-i"))];
    var caja = svg.getBoundingClientRect(), x = (Number(t.getAttribute("x")) + Number(t.getAttribute("width")) / 2) / 600 * caja.width;
    globo.innerHTML = '<b>Semana del ' + semanaTexto(s.desde) + '</b><br>' + s.n + (s.n === 1 ? ' respuesta' : ' respuestas')
      + (s.promedio !== null ? ' · ' + coma(s.promedio) + '★' : '') + (s.malas ? '<br>' + s.malas + ' insatisfecho' + (s.malas > 1 ? 's' : '') : '');
    globo.style.left = Math.max(70, Math.min(caja.width - 70, x)) + "px";
    globo.style.top = "8px";
    globo.classList.add("visible");
  }
  svg.addEventListener("pointermove", mostrarGlobo);
  svg.addEventListener("pointerdown", mostrarGlobo);

    return fetch(TABLERO.ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:'leido',clave:clave(),ids:ids})})
      .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error('lectura');})
      .catch(function(error){if(intento===0)return new Promise(function(resolve){setTimeout(resolve,700);}).then(function(){return guardar(1);});throw error;});
  }
  return guardar(0).then(function(){
    datos.comentarios=(datos.comentarios||[]).filter(function(c){return ids.indexOf(c.id)<0;});
  }).catch(function(){
    originales.forEach(function(c){if(!(datos.comentarios||[]).some(function(x){return x.id===c.id;}))datos.comentarios.push(c);});
    avisoLectura='No se guardó la lectura. Vuelve a intentarlo.';
  }).finally(function(){ids.forEach(function(id){lecturasPendientes.delete(id);});datos.noLeidos=(datos.comentarios||[]).length;if(!saliendo)pintar();});
}

/* Marcar atendido: el botón se apaga hasta que la hoja confirma. */
document.addEventListener("click", function(e){
  var leer = e.target.closest ? e.target.closest('.leer, .leer-todos') : null;
  if (leer){ marcarLeidos(leer.classList.contains('leer-todos') ? null : [leer.getAttribute('data-id')]); return; }
  var cumple = e.target.closest ? e.target.closest(".preparar-cumple, .guardar-cumple") : null;
  if (cumple){ (cumple.classList.contains('guardar-cumple') ? guardarCumple : prepararCumple)(cumple); return; }
  var cupon = e.target.closest ? e.target.closest(".enviar-cupon") : null;
  if (cupon && cupon.tagName==='A') return;
  if (cupon){ enviarCupon(cupon); return; }
  var b = e.target.closest ? e.target.closest(".atender") : null;
  if (!b) return;
  b.disabled = true; b.textContent = "Guardando…";
  fetch(TABLERO.ENDPOINT, {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ accion:"atender", clave:clave(), id:b.getAttribute("data-id"), deshacer: !!b.getAttribute("data-deshacer") })
  }).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || "no se guardó");
    return cargar();
  }).catch(function(){ b.disabled = false; b.textContent = "No se guardó, reintentar"; });
});

var cargando = false;
function pedirClave(error){
  lienzo.innerHTML = '<form class="estado acceso" id="acceso"><h2>Escribe tu clave</h2><label class="tabla-oculta" for="clave-panel">Clave</label><input id="clave-panel" type="password" autocomplete="current-password" required aria-describedby="error-clave"><p id="error-clave" role="alert">'+esc(error || '')+'</p><button class="entrar" type="submit">Entrar</button></form>';
  $('#acceso').addEventListener('submit', function(event){
    event.preventDefault();
    var intento = $('#clave-panel').value.trim();
    if (!intento || cargando) return;
    $('#acceso button').disabled = true;
    cargar(intento);
  });
  $('#clave-panel').focus();
}
function cargar(intento){
  if (cargando || lecturasPendientes.size) return Promise.resolve();
  var candidata = intento || clave();
  if (!candidata) return Promise.resolve();
  var revision = revisionLecturas;
  cargando = true;
  return fetch(TABLERO.ENDPOINT + "?datos=" + encodeURIComponent(candidata))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.error === "clave"){
        claveSesion = ""; datos = null;
        try { localStorage.removeItem(LLAVE); } catch(_){}
        pedirClave("Esa clave no es correcta");
        return;
      }
      if (!d || !d.ok) throw new Error("respuesta inesperada");
      claveSesion = candidata;
      try { localStorage.setItem(LLAVE, candidata); } catch(_){}
      if (lecturasPendientes.size || revision !== revisionLecturas) return;
      datos = d;
      pintar();
    })
    .catch(function(){
      if (intento) pedirClave("No pudimos conectar. Vuelve a intentar.");
      else if (!datos) estado("No pudimos cargar tus datos", "Revisa tu conexión y vuelve a abrir esta página en un minuto.");
      // Conserva los datos pintados si falla un refresco.
    }).finally(function(){ cargando = false; });
}

function arrancar(){
  leerHash();
  if (!TABLERO.ENDPOINT){ estado("Tu panel está casi listo", "Se activa cuando la encuesta de la mesa empiece a guardar respuestas."); return; }
  if (!clave()) pedirClave();
  else cargar();
  // Se refresca solo cada minuto mientras está a la vista.
  reloj = setInterval(function(){ if (document.visibilityState === "visible") cargar(); }, 60000);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") cargar(); });
  window.addEventListener("hashchange", function(){ leerHash(); claveSesion = ""; cargar(); });
}
arrancar();
})();
</script>
