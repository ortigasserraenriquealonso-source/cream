@font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;src:url(t-archivo-700.woff2) format('woff2')}
:root{
  --fondo:#FFFFFF;--superficie:#FFFFFF;--tinta:#2A231F;--tinta-suave:#6B5C53;
  --marca:#836C5F;--marca-ico:#836C5F;--marca-alto:#6E5B4F;--sobre-marca:#FFFFFF;--acento:#836C5F;--linea:#E0D9D3;
  --radio:28px;--titulos:'Archivo',system-ui,sans-serif;--texto:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--fondo);color:var(--tinta);
  font:500 16px/1.4 var(--texto);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
a{color:inherit}
.pagina{width:100%;max-width:440px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}

/* Cabecera */
.cabecera{text-align:center}
.titulo{margin:0;line-height:0}
.logo{margin:0 auto;height:auto}
.lema{margin:12px 0 0;font:400 clamp(23px,6.6vw,28px)/1.08 var(--titulos);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.lema em{font-style:normal;color:var(--acento)}
.lugar{margin:6px 0 0;color:var(--tinta-suave);font-size:14px}

/* Portada recortada (plato sin fondo sobre el color de la marca) */
.recorte .cabecera{position:relative;padding-top:18px}
.recorte .cabecera::before{content:"";position:absolute;inset:-40px -16px auto;height:420px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 52% at 50% 58%,color-mix(in srgb,var(--marca) 46%,transparent),transparent 72%)}
.recorte .plato{width:auto;height:clamp(148px,27vh,236px);margin:6px auto 0;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.recorte .logo{margin-top:6px}

/* Portada con foto (plato servido) y panel que la monta */
.foto .cabecera{margin:0 -16px;padding:0 16px}
.foto .plato{width:calc(100% + 32px);max-width:none;margin:0 -16px;height:clamp(150px,27vh,280px);object-fit:cover;object-position:50% 50%}
.foto .panel{position:relative;margin:-30px -16px 0;padding:0 16px;background:var(--fondo);border-radius:30px 30px 0 0}
.foto .logo{position:relative;top:-50px;margin-bottom:-50px}

/* Acciones */
.acciones{margin-top:20px}
.principales{display:grid;gap:10px}
.boton{display:flex;align-items:center;gap:14px;min-height:58px;padding:10px 18px;border-radius:var(--radio);text-decoration:none;
  transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease;touch-action:manipulation}
.boton:active{transform:scale(.98)}
.boton svg{flex:none;width:24px;height:24px}
.boton .texto{display:grid;text-align:left;flex:1;min-width:0}
.boton b{font:700 17px/1.2 var(--texto)}
.boton small{font-size:13px;line-height:1.25;opacity:.82}
.lleno{background:var(--marca);color:var(--sobre-marca);box-shadow:0 8px 20px -10px var(--marca)}
.lleno:hover{background:var(--marca-alto)}
.borde{border:1.5px solid color-mix(in srgb,var(--tinta) 32%,transparent);color:var(--tinta)}
.borde:hover{border-color:var(--tinta)}
.claro .borde{border-color:var(--marca);color:var(--marca)}
.claro .borde small{color:var(--tinta-suave);opacity:1}

.lista{list-style:none;margin:16px 0 0;padding:0 16px;background:var(--superficie);border-radius:var(--radio)}
.lista li+li{border-top:1px solid var(--linea)}
.fila{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 0;text-decoration:none;touch-action:manipulation}
.fila:active{opacity:.7}
.fila .ico{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
  background:color-mix(in srgb,var(--marca) 14%,transparent);color:var(--marca-ico)}
.fila .ico svg{width:20px;height:20px}
.fila .texto{display:grid;flex:1;min-width:0}
.fila b{font:700 16px/1.25 var(--texto)}
.fila small{color:var(--tinta-suave);font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .flecha{flex:none;width:18px;height:18px;color:var(--tinta-suave)}

a:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.claro a:focus-visible{outline-color:var(--marca)}

/* Redes y pie */
.redes{display:flex;justify-content:center;gap:12px;margin:22px 0 0;padding:0;list-style:none}
.redes a{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--linea);color:var(--tinta);text-decoration:none}
.redes a:active{transform:scale(.94)}
.redes svg{width:21px;height:21px}
.pie{margin-top:26px;text-align:center;color:var(--tinta-suave);font-size:12px;line-height:1.5}
.pie p{margin:0}
.pie .firma{margin-top:6px;opacity:.8}
.pie a{text-decoration:none;border-bottom:1px solid var(--linea)}

/* Entrada: solo si el usuario no pidió reducir el movimiento */
/* El plato y el logo no se animan: son lo primero que se pinta y no deben esperar. */
@media (prefers-reduced-motion:no-preference){
  .principales>*,.lista,.redes{animation:sube .32s cubic-bezier(.2,.7,.2,1) both}
  .principales>:nth-child(2){animation-delay:.04s}.lista{animation-delay:.08s}.redes{animation-delay:.12s}
  @keyframes sube{from{opacity:.001;transform:translateY(8px)}}
}
.icono-sprite{position:absolute;width:0;height:0;overflow:hidden}
/* Claro: composición hermana de la encuesta; sin portada ni resplandor. */
.claro .cabecera{padding-top:32px}
.claro .cabecera::before,.claro .plato{display:none}
.claro .panel{margin:0;padding:0;background:transparent}
.claro .logo{width:180px;max-width:100%;top:0;margin:0 auto}
.claro .lema{margin-top:24px;color:var(--marca);font-size:24px;line-height:1.15}
.claro .lugar{margin-top:10px}
.claro .acciones{margin-top:24px}
.claro .boton{min-height:60px}
.claro .borde{background:#FFFFFF}
.claro .lista{border:1px solid var(--linea)}
.claro .redes a{background:#FFFFFF}
.claro .pie .firma{opacity:1}
